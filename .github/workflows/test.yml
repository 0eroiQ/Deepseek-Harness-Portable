name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  portable:
    env:
      DSH_PORTABLE_NO_AUTO_UPDATE: '1'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            launcher: linux.sh
          - os: ubuntu-24.04
            launcher: linux.sh
          - os: macos-14
            launcher: mac.sh
          - os: windows-2022
            launcher: windows.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Static shell checks
        if: runner.os != 'Windows'
        run: sh -n linux.sh mac.sh scripts/portable.sh scripts/reset.sh
      - name: Initialize current platform
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { & .\windows.bat setup } else { sh "./${{ matrix.launcher }}" setup }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contract tests
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { & .\runtimes\windows-x64\node\node.exe scripts/tests/test-portable.mjs }
          elseif ("${{ runner.os }}" -eq "macOS") { & ./runtimes/macos-arm64/node/bin/node scripts/tests/test-portable.mjs }
          else { & ./runtimes/linux-x64/node/bin/node scripts/tests/test-portable.mjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local model integration tests
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { & .\runtimes\windows-x64\node\node.exe --test scripts/tests/test-local-models.mjs }
          elseif ("${{ runner.os }}" -eq "macOS") { & ./runtimes/macos-arm64/node/bin/node --test scripts/tests/test-local-models.mjs }
          else { & ./runtimes/linux-x64/node/bin/node --test scripts/tests/test-local-models.mjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Live local engine smoke (Apple Silicon)
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: ./runtimes/macos-arm64/node/bin/node scripts/tests/smoke-local-engine.mjs
      - name: Install browser test driver
        if: runner.os == 'macOS'
        run: ./runtimes/macos-arm64/node/bin/node ./runtimes/macos-arm64/node/lib/node_modules/npm/bin/npm-cli.js install --prefix temp/ui-tools --no-save --no-audit --no-fund playwright@1.56.1
      - name: Native local models UI smoke
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: ./runtimes/macos-arm64/node/bin/node scripts/tests/smoke-local-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: local-models-ui
          path: temp/ui-artifacts/
          if-no-files-found: ignore
      - name: Doctor
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { & .\windows.bat doctor } else { sh "./${{ matrix.launcher }}" doctor }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CLI smoke
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { & .\windows.bat -- --help } else { sh "./${{ matrix.launcher }}" -- --help }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
